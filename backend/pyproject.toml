[project]
name = "sajjad-backend"
version = "0.1.0"
description = "Sajjad EASM — Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Validation & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    # Task queue
    "celery[redis]>=5.4",
    "redis>=5.0",
    # HTTP client
    "httpx>=0.27",
    # Email
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    # Scanning engine — installed separately in Docker (see Dockerfile)
    # For local dev: uv sync installs it from the absolute path below
    "sajjad @ file:///home/patitasking/proyectos/Sajjad",
    # DNS resolution for domain verification
    "dnspython>=2.6",
    # Sync DB driver for Celery workers
    "psycopg2-binary>=2.9",
    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
