[project]
name = "sajjad-backend"
version = "0.1.0"
description = "Sajjad EASM — Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Validation & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    # Task queue
    "celery[redis]>=5.4",
    "redis>=5.0",
    # HTTP client
    "httpx>=0.27",
    # Email
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    # Motor de escaneo (paquete `sajjad` en la raíz del repo).
    # La ruta se resuelve en [tool.uv.sources], relativa a este
    # archivo — nunca una ruta absoluta al home del desarrollador.
    "sajjad",
    # DNS resolution for domain verification
    "dnspython>=2.6",
    # Sync DB driver for Celery workers
    "psycopg2-binary>=2.9",
    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Reporte de errores en producción. Opcional: sin SENTRY_DSN el
# código de observabilidad es un no-op y no hace falta instalarlo.
monitoring = [
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.uv.sources]
sajjad = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"

# Mismo conjunto de reglas que el pyproject de la raíz: un único
# criterio de estilo para todo el repo, y sin depender de los
# defaults de ruff (que cambian entre versiones).
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N818 (sufijo "Error" en excepciones) no aplica aquí: el nombre de
# la clase ES el código de error que la API devuelve al cliente
# ({"error": "PlanLimitExceeded"}) y que el frontend traduce.
# Renombrarlas rompería el contrato público.
ignore = ["N806", "N818"]
